<style>

<header><strong>DIVERGENT</strong><small>ORGANIZATION EXPLORER</small><span class="badge">Interactive prototype</span><button class="upload" id="upload">Open Excel workbook</button><input id="file" type="file" accept=".xlsx" hidden></header>
<div class="layout"><aside><h3>Organization</h3><div id="navigation"></div></aside><main>
<div class="toolbar"><button id="tree" aria-pressed="true">Tree</button><button id="table" aria-pressed="false">Table</button><input id="search" aria-label="Search units, IDs or owners" placeholder="Search units, IDs or owners"><button id="focus">Focus branch</button><button id="all">Whole organization</button><button id="expand">Expand one tier</button><button id="collapse">Collapse all</button><button id="fit">Fit view</button></div>
<div class="context"><span id="status" role="status"></span><span id="count"></span></div>
<div id="canvas" aria-label="Interactive organization chart"><div id="world"><svg id="edges"></svg><div id="nodes"></div></div><div class="zoom"><button id="zoom-in" aria-label="Zoom in">+</button><button id="zoom-out" aria-label="Zoom out">−</button><button id="zoom-reset" aria-label="Reset zoom">100%</button></div><div id="help">Click + / − to expand or collapse · Drag canvas to pan · Scroll to zoom</div></div>

</main></div>
<script id="initial-data" type="application/json">{"label":"Synthetic example · Open your workbook to explore your organization","units":[{"id":"0000","parent":"","name":"Corporation","owner":"","tier":0},{"id":"1000","parent":"0000","name":"Example Commercial","owner":"Example owner","tier":1},{"id":"2000","parent":"0000","name":"Example Operations","owner":"Example owner","tier":1},{"id":"2100","parent":"2000","name":"Example Engineering","owner":"","tier":2},{"id":"2110","parent":"2100","name":"Example Structures","owner":"","tier":3},{"id":"2120","parent":"2100","name":"Example Test","owner":"","tier":3},{"id":"2200","parent":"2000","name":"Example Production","owner":"","tier":2}]}</script>
<script>
'use strict';
const $=id=>document.getElementById(id), palette=[['#e8f2ff','#c8dcf6'],['#edf2e8','#d0ddc5'],['#fff0e4','#f0cdb3'],['#eeeafa','#d9ceef'],['#e6f0fa','#cbdcee'],['#fae9ed','#eacbd4'],['#e5f3f1','#c4dfdc'],['#f3efdf','#ded5b7']];
let units=[], byId, children, roots=[], expanded=new Set(), selected='', query='', matching=null, positions=new Map(), width=0,height=0,scale=1,panX=40,panY=40,view='tree',sourceLabel='',focusId='';
function text(parent,tag,value,cls){const e=document.createElement(tag);e.textContent=value;if(cls)e.className=cls;parent.append(e);return e;}
function setStatus(message,error=false){$('status').textContent=message;$('status').classList.toggle('error',error);}
function validate(list){
 if(!list.length)throw Error('No organizational units found.');if(list.length>3000)throw Error('This prototype supports up to 3,000 units.');
 const map=new Map();for(const u of list){if(!u.id||!u.name)throw Error('Every unit needs a Department ID and title.');if(map.has(u.id))throw Error('Duplicate Department ID: '+u.id);map.set(u.id,u);}
 if(list.filter(u=>!u.parent).length!==1)throw Error('The structure must have one root with a blank Parent ID.');
 for(const unit of list){let u=unit,depth=0;const seen=new Set();while(u.parent){if(seen.has(u.id))throw Error('Parent cycle at '+u.id);seen.add(u.id);u=map.get(u.parent);if(!u)throw Error('Missing parent for '+unit.id);depth++;}unit.tier=depth;}
}
function load(list,label){validate(list);units=list;sourceLabel=label;byId=new Map(units.map(u=>[u.id,u]));children=new Map(units.map(u=>[u.id,[]]));roots=units.filter(u=>!u.parent);for(const u of units)if(u.parent)children.get(u.parent).push(u);expanded=new Set(roots.map(u=>u.id));const operations=units.find(u=>u.name==='Operations');if(operations){expanded.add(operations.id);for(const u of children.get(operations.id))if(u.name==='Product Engineering')expanded.add(u.id);}selected=operations?.id||roots[0].id;focusId=operations?.id||'';query='';$('search').value='';matching=null;setStatus(label+' · Read-only; changes to the workbook are not made');render();requestAnimationFrame(fit);}
function inFocus(id){if(!focusId)return true;let u=byId.get(id);while(u){if(u.id===focusId)return true;u=byId.get(u.parent);}u=byId.get(focusId);while(u){if(u.id===id)return true;u=byId.get(u.parent);}return false;}
function visibleChildren(u){return children.get(u.id).filter(c=>(!matching||matching.has(c.id))&&inFocus(c.id));}
function isOpen(id){return !!query||expanded.has(id);}
function toggle(id){if(query){query='';$('search').value='';matching=null;}expanded.has(id)?expanded.delete(id):expanded.add(id);selected=id;render();}
function select(id,focus=false){selected=id;if(focus&&!inFocus(id))focusId=id;let u=byId.get(id);while(u.parent){expanded.add(u.parent);u=byId.get(u.parent);}render();if(focus){const p=positions.get(id);if(p){panX=$('canvas').clientWidth/2-(p.x+125)*scale;panY=$('canvas').clientHeight/2-(p.y+56)*scale;transform();}}}
function layout(){positions=new Map();function subtree(u,depth,color){const nodes=new Map(),kids=isOpen(u.id)?visibleChildren(u):[];let previousRoot=-Infinity;const childRoots=[];for(const [i,c] of kids.entries()){const part=subtree(c,depth+1,depth===0?palette[children.get(u.id).indexOf(c)%palette.length]:color);let shift=previousRoot+148; if(!Number.isFinite(shift))shift=0;for(const a of nodes.values())for(const b of part.values())if(a.x===b.x)shift=Math.max(shift,a.y+148-b.y);for(const [id,p] of part)nodes.set(id,{...p,y:p.y+shift});childRoots.push(shift);previousRoot=shift;}const center=childRoots.length?(childRoots[0]+childRoots[childRoots.length-1])/2:0;for(const p of nodes.values())p.y-=center;nodes.set(u.id,{x:depth*350,y:0,color});return nodes;}for(const r of roots)if(!matching||matching.has(r.id)){const nodes=subtree(r,0,['#edf1f6','#cbd7e4']),minY=Math.min(...[...nodes.values()].map(p=>p.y));for(const [id,p] of nodes)positions.set(id,{...p,y:p.y-minY});}width=Math.max(0,...[...positions.values()].map(p=>p.x+265));height=Math.max(0,...[...positions.values()].map(p=>p.y+125));}
function render(){layout();$('nodes').replaceChildren();$('edges').replaceChildren();$('edges').setAttribute('width',width);$('edges').setAttribute('height',height);
 for(const [id,p] of positions){const u=byId.get(id),parent=positions.get(u.parent);if(parent){const path=document.createElementNS('http://www.w3.org/2000/svg','path'),x=parent.x+250,y=parent.y+56,tx=p.x,ty=p.y+56;path.setAttribute('d',`M${x},${y} C${x+50},${y} ${tx-50},${ty} ${tx},${ty}`);path.setAttribute('fill','none');path.setAttribute('stroke','#a5b2bf');path.setAttribute('stroke-width','1.5');$('edges').append(path);}
 const card=document.createElement('div');card.className='card'+(id===selected?' selected':'');card.dataset.id=id;card.style.left=p.x+'px';card.style.top=p.y+'px';card.style.setProperty('--fill',p.color[0]);card.style.setProperty('--border',p.color[1]);card.tabIndex=0;card.setAttribute('aria-label',u.name);card.onclick=()=>select(id);card.onkeydown=e=>{if(e.target===card&&(e.key==='Enter'||e.key===' ')){e.preventDefault();select(id);}};
 text(card,'span',`${u.id} · ${['Corporate','Function','Group','Department','Team'][u.tier]||'Tier '+u.tier}`,'meta');text(card,'strong',u.name);if(u.owner)text(card,'span',u.owner,'owner');card.title=u.name+(u.owner?' — '+u.owner:'')+(u.purpose?'\n'+u.purpose:'');
 const count=children.get(id).length;if(count){const b=text(card,'button',isOpen(id)?'−':'+','toggle');b.setAttribute('aria-label',(isOpen(id)?'Collapse ':'Expand ')+u.name);b.setAttribute('aria-expanded',String(isOpen(id)));b.onclick=e=>{e.stopPropagation();toggle(id);};text(card,'span',count+' units','kids');}$('nodes').append(card);
 }
 $('navigation').replaceChildren();function nav(u,depth){if(matching&&!matching.has(u.id))return;const row=document.createElement('div');row.className='nav-row'+(selected===u.id?' selected':'');row.style.paddingLeft=depth*12+'px';const b=text(row,'button',children.get(u.id).length?(isOpen(u.id)?'⌄':'›'):'·','nav-toggle');b.disabled=!children.get(u.id).length;b.setAttribute('aria-label',(isOpen(u.id)?'Collapse navigation ':'Expand navigation ')+u.name);b.onclick=()=>toggle(u.id);const title=text(row,'button',u.name,'nav-name');title.onclick=()=>{setView('tree');select(u.id,true);};$('navigation').append(row);if(isOpen(u.id))for(const child of children.get(u.id))nav(child,depth+1);}roots.forEach(r=>nav(r,0));
 $('rows').replaceChildren();for(const u of units){if(query&&!`${u.id} ${u.name} ${u.owner}`.toLowerCase().includes(query))continue;const tr=document.createElement('tr');for(const val of [u.id,u.parent,u.name,u.owner,u.tier])text(tr,'td',String(val));tr.onclick=()=>{query='';$('search').value='';matching=null;setView('tree');select(u.id,true);};$('rows').append(tr);}
 $('count').textContent=positions.size+' shown / '+units.length+' units';transform();
}
function transform(){$('world').style.transform=`translate(${panX}px,${panY}px) scale(${scale})`; $('zoom-reset').textContent=Math.round(scale*100)+'%';}
function fit(){if(view!=='tree'||!width||!height)return;const c=$('canvas');scale=Math.max(.08,Math.min(1.1,(c.clientWidth-90)/width,(c.clientHeight-90)/height));panX=(c.clientWidth-width*scale)/2;panY=(c.clientHeight-height*scale)/2;transform();}
function zoom(next,x=$('canvas').clientWidth/2,y=$('canvas').clientHeight/2){next=Math.max(.08,Math.min(2.5,next));panX=x-(x-panX)*next/scale;panY=y-(y-panY)*next/scale;scale=next;transform();}
function setView(next){view=next;$('canvas').hidden=next!=='tree';$('table-view').hidden=next!=='table';$('tree').setAttribute('aria-pressed',String(next==='tree'));$('table').setAttribute('aria-pressed',String(next==='table'));}
let drag=null;$('canvas').onpointerdown=e=>{if(e.target.closest('button,.card'))return;drag={x:e.clientX,y:e.clientY,px:panX,py:panY};$('canvas').setPointerCapture(e.pointerId);$('canvas').classList.add('dragging');};$('canvas').onpointermove=e=>{if(drag){panX=drag.px+e.clientX-drag.x;panY=drag.py+e.clientY-drag.y;transform();}};function endDrag(){drag=null;$('canvas').classList.remove('dragging');}$('canvas').onpointerup=endDrag;$('canvas').onpointercancel=endDrag;
 $('canvas').addEventListener('wheel',e=>{e.preventDefault();const r=$('canvas').getBoundingClientRect();zoom(scale*Math.exp(-e.deltaY*.0015),e.clientX-r.left,e.clientY-r.top);},{passive:false});
 $('fit').onclick=fit;$('zoom-in').onclick=()=>zoom(scale*1.2);$('zoom-out').onclick=()=>zoom(scale/1.2);$('zoom-reset').onclick=()=>zoom(1);$('tree').onclick=()=>{setView('tree');requestAnimationFrame(fit);};$('table').onclick=()=>setView('table');
 $('focus').onclick=()=>{focusId=selected;query='';matching=null;$('search').value='';expanded.add(selected);render();fit();};$('all').onclick=()=>{focusId='';render();fit();};
 $('collapse').onclick=()=>{focusId='';query='';matching=null;$('search').value='';expanded.clear();render();fit();};$('expand').onclick=()=>{for(const id of positions.keys())expanded.add(id);render();fit();};
 $('search').oninput=e=>{focusId='';query=e.target.value.trim().toLowerCase();matching=query?new Set():null;if(query)for(const u of units)if(`${u.id} ${u.name} ${u.owner}`.toLowerCase().includes(query)){let n=u;while(n){matching.add(n.id);n=byId.get(n.parent);}}render();fit();};
 new ResizeObserver(()=>{if(!drag)fit();}).observe($('canvas'));
 // XLSX is a ZIP of XML files. Read only the Org Structure sheet, entirely locally.
 async function unzip(buffer){const d=new DataView(buffer),bytes=new Uint8Array(buffer),files=new Map();let end=-1;for(let i=bytes.length-22;i>=Math.max(0,bytes.length-65557);i--)if(d.getUint32(i,true)===0x06054b50){end=i;break;}if(end<0)throw Error('This is not a readable .xlsx workbook.');let offset=d.getUint32(end+16,true),count=d.getUint16(end+10,true),total=0;if(count>10000)throw Error('Workbook has too many ZIP entries.');for(let i=0;i<count;i++){if(d.getUint32(offset,true)!==0x02014b50)throw Error('Invalid workbook ZIP directory.');const method=d.getUint16(offset+10,true),compressed=d.getUint32(offset+20,true),size=d.getUint32(offset+24,true),n=d.getUint16(offset+28,true),extra=d.getUint16(offset+30,true),comment=d.getUint16(offset+32,true),local=d.getUint32(offset+42,true),name=new TextDecoder().decode(bytes.slice(offset+46,offset+46+n));files.set(name,{method,compressed,size,local});offset+=46+n+extra+comment;}
 return async name=>{const f=files.get(name);if(!f)throw Error('Missing workbook component: '+name);if(f.size>30*1024*1024||(total+=f.size)>80*1024*1024)throw Error('Workbook contents are too large for this prototype.');const start=f.local+30+d.getUint16(f.local+26,true)+d.getUint16(f.local+28,true),part=bytes.slice(start,start+f.compressed);if(f.method===0)return new TextDecoder().decode(part);if(f.method!==8)throw Error('Unsupported workbook compression.');const stream=new Blob([part]).stream().pipeThrough(new DecompressionStream('deflate-raw'));const reader=stream.getReader(),chunks=[];let length=0;for(;;){const {value,done}=await reader.read();if(done)break;length+=value.length;if(length>30*1024*1024){await reader.cancel();throw Error('Workbook XML is too large.');}chunks.push(value);}return await new Blob(chunks).text();};}
 const xml=s=>{const doc=new DOMParser().parseFromString(s,'application/xml');if(doc.querySelector('parsererror'))throw Error('Invalid workbook XML.');return doc;};
 const tags=(node,name)=>[...node.getElementsByTagNameNS('*',name)];
 async function readWorkbook(file){if(file.size>32*1024*1024)throw Error('Choose a workbook smaller than 32 MB.');const read=await unzip(await file.arrayBuffer()),book=xml(await read('xl/workbook.xml')),rels=xml(await read('xl/_rels/workbook.xml.rels'));const sheet=tags(book,'sheet').find(s=>s.getAttribute('name').trim().toLowerCase()==='org structure');if(!sheet)throw Error('No "Org Structure" sheet found. Please choose Org Chart Organizer.xlsx.');const rid=sheet.getAttributeNS('http://schemas.openxmlformats.org/officeDocument/2006/relationships','id'),rel=tags(rels,'Relationship').find(r=>r.getAttribute('Id')===rid);if(!rel)throw Error('Cannot locate Org Structure sheet.');const target=rel.getAttribute('Target'),path=new URL(target,'https://local.invalid/xl/').pathname.slice(1);let shared=[];const sharedRel=tags(rels,'Relationship').find(r=>(r.getAttribute('Type')||'').endsWith('/sharedStrings'));if(sharedRel){const sp=new URL(sharedRel.getAttribute('Target'),'https://local.invalid/xl/').pathname.slice(1);shared=tags(xml(await read(sp)),'si').map(si=>tags(si,'t').map(t=>t.textContent).join(''));}
 const doc=xml(await read(path)),rows=tags(doc,'row').map(row=>{const out=[];for(const c of tags(row,'c')){const ref=(c.getAttribute('r')||'A').match(/^[A-Z]+/)[0];let col=0;for(const char of ref)col=col*26+char.charCodeAt(0)-64;const value=tags(c,'v')[0]?.textContent||'',type=c.getAttribute('t');out[col-1]=type==='s'?(shared[Number(value)]||''):type==='inlineStr'?tags(c,'t').map(t=>t.textContent).join(''):value;}return out;});const h=rows.findIndex(r=>r.includes('Department ID')&&r.includes('Parent ID')&&r.includes('Department Title'));if(h<0)throw Error('Org Structure needs Department ID, Parent ID, and Department Title headers.');const header=rows[h];const field=(r,k)=>String(r[header.indexOf(k)]||'').trim();return rows.slice(h+1).filter(r=>field(r,'Department ID')).map(r=>({id:field(r,'Department ID'),parent:field(r,'Parent ID'),name:field(r,'Department Title'),owner:field(r,'Department Owner'),purpose:field(r,'Department Purpose')}));}
 $('upload').onclick=()=>$('file').click();$('file').onchange=async e=>{const file=e.target.files[0];if(!file)return;$('upload').disabled=true;setStatus('Reading your workbook locally…');try{const list=await readWorkbook(file);load(list,file.name+' · Processed locally in your browser');}catch(err){setStatus(err.message+' Your current chart is unchanged.',true);}finally{$('upload').disabled=false;e.target.value='';}};
 const initial=JSON.parse($('initial-data').textContent);load(initial.units,initial.label);
</script>
